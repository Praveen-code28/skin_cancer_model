# Skin Cancer Classification Pipeline Configuration
# Dataset: ISIC 2019 Preprocessed (25,331 images, 8 classes, leakage-free splits)

# Experiment settings
experiment:
  name: "skin_cancer_classification"
  seed: 42
  device: "auto"  # "cuda", "cpu", or "auto"
  num_workers: 4
  pin_memory: true

# Data settings
data:
  root_path: "../dataset"
  labels_csv: "labels.csv"
  image_size: 224
  batch_size: 32  # Adjust for 8GB VRAM; use gradient_accumulation_steps if OOM
  # Pre-defined splits in CSV: train, val, test (no leakage - grouped by lesion_id)
  use_predefined_splits: true
  # Class imbalance handling
  use_class_weights: true
  use_weighted_sampler: false  # Set true for oversampling minority classes
  # Data augmentation
  train_augmentation:
    enabled: true
    horizontal_flip: 0.5
    vertical_flip: 0.5
    rotate_limit: 30
    shift_scale_rotate: 0.5
    brightness_contrast: 0.5
    hue_saturation: 0.3
    gauss_noise: 0.2
    cutout: 0.2
    normalize: true
  val_test_augmentation:
    normalize: true

# Model settings
models:
  # List of models to train and evaluate
  - name: "efficientnet_b0"
    timm_name: "efficientnet_b0"
    pretrained: true
  - name: "convnext_tiny"
    timm_name: "convnext_tiny"
    pretrained: true
  - name: "resnet50d"
    timm_name: "resnet50d"
    pretrained: true

# Training settings
training:
  epochs: 50
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  optimizer: "adamw"
  scheduler: "cosine_annealing_warm_restarts"
  scheduler_params:
    T_0: 10
    T_mult: 2
    eta_min: 1.0e-6
  # Loss function
  loss:
    type: "focal"  # "ce" (cross-entropy), "focal", "label_smoothing"
    focal_gamma: 2.0
    focal_alpha: 0.25
    label_smoothing: 0.1
  # Mixed precision & gradient accumulation
  amp: true
  gradient_accumulation_steps: 1  # Increase if OOM (e.g., 2, 4)
  # Early stopping
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1.0e-4
    monitor: "macro_f1"
    mode: "max"
  # Gradient clipping
  gradient_clip: 1.0
  # Checkpointing
  save_best_only: true
  save_last: true

# Evaluation settings
evaluation:
  # Metrics to compute
  metrics:
    - "accuracy"
    - "balanced_accuracy"
    - "macro_f1"
    - "per_class_precision"
    - "per_class_recall"
    - "per_class_f1"
    - "per_class_specificity"
    - "roc_auc_ovr"
    - "roc_auc_ovo"
    - "pr_auc"
  # Confusion matrix
  confusion_matrix:
    normalize: "true"  # "true", "pred", "all", or null
  # Grad-CAM
  gradcam:
    enabled: true
    target_layer: "auto"  # Auto-detect last conv layer
    num_samples_per_class: 5
    alpha: 0.5
    colormap: "jet"

# Logging & output
output:
  results_dir: "results"
  checkpoints_dir: "checkpoints"
  metrics_dir: "metrics"
  plots_dir: "plots"
  gradcam_dir: "gradcam"
  eda_dir: "eda"
  test_logs_dir: "test_logs"
  log_level: "INFO"
  log_to_file: true
  save_predictions: true

# Testing
testing:
  run_tests_before_training: true
  pytest_args: "-v --tb=short"